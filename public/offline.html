<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - PRIME</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Barlow", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f7f7f7;
        color: #111;
      }
      .container { text-align: center; padding: 2rem; max-width: 360px; }
      .logo { font-size: 2rem; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 2rem; }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
      p { color: #666; margin-bottom: 1.5rem; line-height: 1.5; }
      button { background: #111; color: #fff; border: none; padding: 0.75rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 0.375rem; }
      button:hover { background: #333; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">PRIME</div>
      <h1>You're offline</h1>
      <p>Please check your internet connection and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
